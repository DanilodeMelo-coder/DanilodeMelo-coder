<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1f"/>
      <stop offset="0.6" stop-color="#0f0c2e"/>
      <stop offset="1" stop-color="#1c0f45"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1650"/>
      <stop offset="0.55" stop-color="#2a1f6e"/>
      <stop offset="0.56" stop-color="#14123a"/>
      <stop offset="1" stop-color="#0c0b26"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="xhair" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="6" fill="none" stroke="#e5e7eb" stroke-width="1.8"/>
      <path d="M10 1v5M10 14v5M1 10h5M14 10h5" stroke="#e5e7eb" stroke-width="1.8"/>
    </symbol>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g fill="#c4b5fd" opacity="0.5">
    <circle cx="80" cy="40" r="1.2"/><circle cx="310" cy="28" r="1"/><circle cx="520" cy="60" r="1.4"/>
    <circle cx="640" cy="24" r="1"/><circle cx="1150" cy="40" r="1.2"/><circle cx="1170" cy="200" r="1"/>
    <circle cx="560" cy="210" r="1"/><circle cx="440" cy="120" r="1"/>
  </g>

  <!-- brilho do monitor na parede -->
  <ellipse cx="900" cy="180" rx="260" ry="150" fill="#7c3aed" opacity="0.35" filter="url(#glow)"/>

  <!-- mesa -->
  <rect x="600" y="322" width="600" height="12" fill="#221c5a"/>
  <rect x="600" y="334" width="600" height="66" fill="#0b0920"/>
  <line x1="600" y1="322" x2="1200" y2="322" stroke="#8b5cf6" stroke-width="2" opacity="0.8" filter="url(#softglow)"/>

  <!-- visualizador de música na mesa -->
  <g transform="translate(640 318)" fill="#818cf8">
    <rect x="0" y="-20" width="6" height="20" rx="2">
      <animate attributeName="height" values="20;8;26;12;20" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-8;-26;-12;-20" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="-12" width="6" height="12" rx="2" fill="#a78bfa">
      <animate attributeName="height" values="12;28;10;22;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-12;-28;-10;-22;-12" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="-24" width="6" height="24" rx="2">
      <animate attributeName="height" values="24;10;18;30;24" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-24;-10;-18;-30;-24" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="-10" width="6" height="10" rx="2" fill="#a78bfa">
      <animate attributeName="height" values="10;22;14;6;10" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-22;-14;-6;-10" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- monitor -->
  <rect x="696" y="56" width="408" height="238" rx="10" fill="#0a0820" stroke="#3b3394" stroke-width="2"/>
  <rect x="706" y="66" width="388" height="218" rx="4" fill="url(#screen)"/>
  <!-- cenário genérico de FPS -->
  <g opacity="0.9">
    <rect x="706" y="150" width="70" height="40" fill="#231c5c"/>
    <rect x="1010" y="130" width="84" height="60" fill="#231c5c"/>
    <rect x="740" y="210" width="56" height="50" fill="#1e1850" stroke="#3a2f8a"/>
    <path d="M740 210 L796 260 M796 210 L740 260" stroke="#3a2f8a"/>
    <rect x="1000" y="220" width="64" height="44" fill="#1e1850" stroke="#3a2f8a"/>
    <path d="M1000 220 L1064 264 M1064 220 L1000 264" stroke="#3a2f8a"/>
  </g>
  <!-- mira -->
  <g stroke="#c4b5fd" stroke-width="2.5" filter="url(#softglow)">
    <path d="M900 156v-10M900 184v10M886 170h-10M914 170h10"/>
  </g>
  <!-- HUD -->
  <text x="900" y="84" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c4b5fd" text-anchor="middle">1:42</text>
  <text x="716" y="276" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#a5b4fc">+ 100</text>
  <text x="1084" y="276" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#a5b4fc" text-anchor="end">30 / 90</text>
  <text x="1084" y="84" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#e5e7eb" text-anchor="end" opacity="0.85">dan ⊕ bug</text>
  <!-- suporte -->
  <rect x="888" y="294" width="24" height="22" fill="#15123a"/>
  <rect x="850" y="314" width="100" height="8" rx="3" fill="#1d1848"/>

  <!-- personagem de costas -->
  <g>
    <!-- braço até o mouse -->
    <path d="M960 340 Q1010 318 1058 320" stroke="#120f2e" stroke-width="20" stroke-linecap="round" fill="none"/>
    <ellipse cx="1068" cy="320" rx="13" ry="7" fill="#2a2366" stroke="#8b5cf6" stroke-width="1"/>
    <!-- corpo / moletom -->
    <path d="M812 400 Q814 312 900 300 Q986 312 988 400 Z" fill="#120f2e"/>
    <path d="M812 400 Q814 312 900 300 Q986 312 988 400" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <!-- pescoço -->
    <rect x="886" y="272" width="28" height="34" rx="8" fill="#0d0b24"/>
    <!-- cabeça -->
    <circle cx="900" cy="246" r="35" fill="#0d0b24" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- cabelo -->
    <path d="M864 244 Q862 206 900 204 Q940 204 937 244 Q930 226 900 222 Q872 224 864 244 Z" fill="#05040f"/>
    <path d="M866 236 Q872 208 900 206 Q930 208 935 236" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
    <!-- fone -->
    <path d="M860 250 A40 42 0 0 1 940 250" fill="none" stroke="#6d28d9" stroke-width="7" stroke-linecap="round"/>
    <rect x="849" y="236" width="16" height="30" rx="7" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="935" y="236" width="16" height="30" rx="7" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- cadeira -->
    <rect x="842" y="330" width="116" height="70" rx="16" fill="#1a1545" stroke="#2f2880" stroke-width="2"/>
    <rect x="884" y="342" width="32" height="6" rx="3" fill="#7c3aed" opacity="0.8"/>
  </g>

  <!-- notas musicais subindo -->
  <g font-family="'Segoe UI Symbol', 'DejaVu Sans', sans-serif" fill="#c4b5fd">
    <text x="826" y="236" font-size="22" opacity="0">♪
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -60" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="958" y="232" font-size="20" opacity="0">♫
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;16 -64" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="832" y="250" font-size="16" opacity="0" fill="#818cf8">♪
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-22 -50" dur="2.8s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- texto -->
  <text x="60" y="88" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8b8fd6">&gt; connect danilo<tspan fill="#c4b5fd">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  <text x="58" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#f5f3ff" letter-spacing="2">DANILO</text>
  <text x="58" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#nameGrad)" letter-spacing="2">MELO</text>
  <text x="62" y="258" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#c4b5fd">software engineer</text>

  <!-- kill feed -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <g transform="translate(60 302)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
      <rect x="0" y="-19" width="300" height="27" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="12" y="0" fill="#a78bfa">Danilo</text>
      <use href="#xhair" x="76" y="-15" width="18" height="18"/>
      <text x="104" y="0" fill="#e5e7eb">NullPointerException</text>
    </g>
    <g transform="translate(60 337)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
      <rect x="0" y="-19" width="256" height="27" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="12" y="0" fill="#a78bfa">Danilo</text>
      <use href="#xhair" x="76" y="-15" width="18" height="18"/>
      <text x="104" y="0" fill="#e5e7eb">bug em produção</text>
    </g>
    <g transform="translate(60 372)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/>
      <rect x="0" y="-19" width="256" height="27" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="12" y="0" fill="#a78bfa">Danilo</text>
      <use href="#xhair" x="76" y="-15" width="18" height="18"/>
      <text x="104" y="0" fill="#e5e7eb">deploy de sexta</text>
    </g>
  </g>
</svg>
